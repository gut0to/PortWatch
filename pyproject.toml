[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portwatch"
version = "0.1.0"
description = "Find out what's using your ports without memorizing netstat, lsof or ss."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PortWatch contributors" }]
dependencies = [
    "psutil>=5.9",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-psutil>=5.9",
]
bundle = [
    "pyinstaller>=6.10,<7",
]

[project.scripts]
portwatch = "portwatch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.coverage.run]
branch = true
source = ["portwatch"]

[tool.coverage.report]
fail_under = 100
