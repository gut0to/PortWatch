name: Windows executable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-executable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install bundler
        run: python -m pip install --upgrade pip
      - name: Install project and bundler
        run: python -m pip install ".[bundle]"
      - name: Build and verify executable
        run: python scripts/build_windows.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: portwatch-windows-x64
          path: dist/portwatch.exe*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download executable
        uses: actions/download-artifact@v4
        with:
          name: portwatch-windows-x64
          path: dist
      - name: Attach executable to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/portwatch.exe
            dist/portwatch.exe.sha256
          generate_release_notes: true
